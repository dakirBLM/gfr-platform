{# Password visibility toggle button. Expects `target_id` (the input's id). #}
<button type="button" class="password-toggle-btn absolute inset-y-0 right-0 flex w-11 items-center justify-center text-ink-400 hover:text-ink-600 focus:outline-none"
        data-target="{{ target_id }}" aria-label="Show password" tabindex="-1">
  <svg class="eye-open w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="M2.04 12.32a1.01 1.01 0 0 1 0-.64C3.42 7.51 7.36 4.5 12 4.5s8.58 3.01 9.96 7.18c.06.21.06.43 0 .64C20.58 16.49 16.64 19.5 12 19.5S3.42 16.49 2.04 12.32Z"/>
    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
  </svg>
  <svg class="eye-closed w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="M2.04 12.32a1.01 1.01 0 0 1 0-.64C3.42 7.51 7.36 4.5 12 4.5c2.5 0 4.83.9 6.66 2.39"/>
    <path stroke-linecap="round" stroke-linejoin="round" d="M21.96 11.68a1.01 1.01 0 0 1 0 .64C20.58 16.49 16.64 19.5 12 19.5c-1.7 0-3.33-.43-4.73-1.19"/>
    <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18"/>
    <path stroke-linecap="round" stroke-linejoin="round" d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
  </svg>
</button>
