{% extends 'base.html' %}

{% block title %}Sign in · GFR{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 sm:px-6 py-16">
  <div class="bg-white border border-ink-100 rounded-2xl p-8 shadow-sm">
    <h1 class="font-serif text-2xl font-semibold">Welcome back</h1>
    <p class="mt-1 text-sm text-ink-600">Sign in to your GFR account.</p>

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}

      {% if form.non_field_errors %}
        <div class="rounded-md bg-rose-50 border border-rose-200 text-rose-800 text-sm px-3 py-2">
          {{ form.non_field_errors|join:" " }}
        </div>
      {% endif %}

      <label class="block">
        <span class="text-sm font-medium text-ink-700">Username</span>
        <input type="text" name="username" required autofocus
               class="mt-1 w-full rounded-md border border-ink-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      </label>
      <label class="block">
        <span class="text-sm font-medium text-ink-700">Password</span>
        <input type="password" name="password" required
               class="mt-1 w-full rounded-md border border-ink-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
      </label>

      <input type="hidden" name="next" value="{{ next }}">
      <button class="w-full px-4 py-2.5 rounded-md bg-brand-700 text-white font-semibold hover:bg-brand-800">Sign in</button>
    </form>

    <p class="mt-6 text-sm text-ink-600 text-center">
      No account yet? <a href="{% url 'accounts:register' %}" class="font-semibold text-brand-700 hover:text-brand-800">Join GFR</a>
    </p>
  </div>
</section>
{% endblock %}
