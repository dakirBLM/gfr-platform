{% load static %}
<style>
  @keyframes sandy-float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-7px) rotate(1deg); }
  }
  @keyframes sandy-ring {
    0% { transform: scale(.85); opacity: .6; }
    75%, 100% { transform: scale(1.45); opacity: 0; }
  }
  @keyframes sandy-arrive {
    from { opacity: 0; transform: translateY(12px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes sandy-typing {
    0%, 60%, 100% { transform: translateY(0); opacity: .35; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  .sandy-float { animation: sandy-float 3.2s ease-in-out infinite; }
  .sandy-ring { animation: sandy-ring 2.2s ease-out infinite; }
  .sandy-arrive { animation: sandy-arrive .22s ease-out both; }
  .sandy-typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: #64748b;
    animation: sandy-typing 1.2s ease-in-out infinite;
  }
  .sandy-typing-dot:nth-child(2) { animation-delay: .15s; }
  .sandy-typing-dot:nth-child(3) { animation-delay: .3s; }
  @media (prefers-reduced-motion: reduce) {
    .sandy-float, .sandy-ring, .sandy-arrive, .sandy-typing-dot { animation: none; }
  }
  #sandy-chat-log::-webkit-scrollbar { width: 6px; }
  #sandy-chat-log::-webkit-scrollbar-thumb { background: #d5dce5; border-radius: 999px; }
</style>

<aside id="sandy-widget" class="fixed bottom-5 right-5 z-50 flex flex-col items-end gap-3"
       data-chat-url="{% url 'dashboard:sandy_chat' %}"
       data-user-name="{{ user.display_name|escape }}"
       data-user-avatar="{{ user.avatar_url }}"
       data-sandy-avatar="{% static 'img/sandy-mascot.png' %}">
  <div id="sandy-prompt"
       class="sandy-arrive max-w-[17rem] rounded-2xl border border-brand-100 bg-white px-4 py-3 shadow-xl shadow-brand-900/10">
    <div class="flex items-center gap-3">
      <img src="{% static 'img/sandy-mascot.png' %}" alt=""
           class="h-9 w-9 shrink-0 rounded-full border border-brand-100 bg-white object-cover shadow-sm">
      <span>
        <span class="block text-xs font-bold text-brand-700">Sandy</span>
        <span class="block text-[11px] leading-snug text-ink-600">Chat with me, or leave a review — your call.</span>
      </span>
    </div>
    <div class="mt-3 grid grid-cols-2 gap-2">
      <button type="button" data-sandy-quick="chat"
              class="flex items-center justify-center gap-1.5 rounded-xl bg-brand-700 px-2 py-2 text-xs font-semibold text-white transition hover:bg-brand-800 focus:outline-none focus:ring-2 focus:ring-brand-300">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8M8 14h5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        Chat
      </button>
      <button type="button" data-sandy-quick="review"
              class="flex items-center justify-center gap-1.5 rounded-xl bg-teal-600 px-2 py-2 text-xs font-semibold text-white transition hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-300">
        <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11.05 2.93l1.08 2.18 2.41.35-1.74 1.7.41 2.4-2.16-1.14-2.16 1.14.41-2.4-1.74-1.7 2.41-.35 1.08-2.18zM5 14h14M5 18h10"/>
        </svg>
        Review
      </button>
    </div>
  </div>

  <section id="sandy-panel"
           class="hidden sandy-arrive w-[min(22rem,calc(100vw-2.5rem))] max-h-[calc(100vh-3rem)] overflow-x-hidden overflow-y-auto rounded-2xl border border-ink-100 bg-white shadow-2xl shadow-brand-900/20"
           aria-labelledby="sandy-title">
    <div class="flex items-center justify-between bg-gradient-to-r from-brand-800 to-brand-600 px-5 py-4 text-white">
      <div class="flex items-center gap-3">
        <img src="{% static 'img/sandy-mascot.png' %}" alt="Sandy"
             class="h-11 w-11 rounded-full border-2 border-white/80 bg-white object-cover shadow-md">
        <div>
          <p class="text-[11px] font-semibold uppercase tracking-[.18em] text-brand-100">Meet Sandy</p>
          <h2 id="sandy-title" class="font-serif text-lg font-semibold">Your GFR guide</h2>
        </div>
      </div>
      <button type="button" id="sandy-close"
              class="rounded-full p-1.5 text-brand-100 transition hover:bg-white/10 hover:text-white"
              aria-label="Close Sandy">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <div id="sandy-mode-picker" class="space-y-3 p-5">
      <p class="text-sm text-ink-600">What would you like to do?</p>
      <button type="button" data-sandy-mode="chat"
              class="flex w-full items-center gap-3 rounded-xl border border-ink-100 bg-ink-50 px-4 py-3 text-left transition hover:border-brand-300 hover:bg-brand-50">
        <span class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-700 text-white">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8M8 14h5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </span>
        <span>
          <span class="block text-sm font-semibold text-ink-900">Chat with Sandy</span>
          <span class="block text-xs text-ink-600">Ask how GFR works for your role.</span>
        </span>
      </button>
      <button type="button" data-sandy-mode="review"
              class="flex w-full items-center gap-3 rounded-xl border border-ink-100 bg-ink-50 px-4 py-3 text-left transition hover:border-brand-300 hover:bg-brand-50">
        <span class="flex h-10 w-10 items-center justify-center rounded-full bg-teal-600 text-white">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.05 2.93l1.08 2.18 2.41.35-1.74 1.7.41 2.4-2.16-1.14-2.16 1.14.41-2.4-1.74-1.7 2.41-.35 1.08-2.18zM5 14h14M5 18h10"/>
          </svg>
        </span>
        <span>
          <span class="block text-sm font-semibold text-ink-900">Leave a review</span>
          <span class="block text-xs text-ink-600">Rate GFR and share bugs or ideas.</span>
        </span>
      </button>
    </div>

    <div id="sandy-tabs" class="hidden border-b border-ink-100 px-5">
      <div class="flex gap-1" role="tablist" aria-label="Sandy modes">
        <button type="button" role="tab" data-sandy-tab="chat" aria-selected="false"
                class="px-3 py-2.5 text-sm font-semibold text-ink-500 border-b-2 border-transparent">Chat</button>
        <button type="button" role="tab" data-sandy-tab="review" aria-selected="false"
                class="px-3 py-2.5 text-sm font-semibold text-ink-500 border-b-2 border-transparent">Review</button>
      </div>
    </div>

    <div id="sandy-chat" class="hidden flex flex-col" style="height: 22rem;">
      <div id="sandy-chat-log" class="flex-1 space-y-3 overflow-y-auto px-4 py-4" aria-live="polite"></div>
      <p id="sandy-chat-error" class="hidden mx-4 mb-2 rounded-lg bg-rose-50 px-3 py-2 text-xs text-rose-700" role="alert"></p>
      <form id="sandy-chat-form" class="flex items-end gap-2 border-t border-ink-100 p-3">
        <label class="sr-only" for="sandy-chat-input">Message Sandy</label>
        <textarea id="sandy-chat-input" rows="2" maxlength="1500" required
                  placeholder="Ask Sandy anything about GFR…"
                  class="max-h-32 min-h-[3rem] flex-1 resize-none rounded-xl border border-ink-200 bg-ink-50 px-3 py-2.5 text-sm focus:border-brand-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20"></textarea>
        <button type="submit" id="sandy-chat-send"
                class="rounded-xl bg-brand-700 px-3 py-2.5 text-sm font-semibold text-white hover:bg-brand-800 disabled:cursor-wait disabled:opacity-60"
                aria-label="Send message">
          Send
        </button>
      </form>
    </div>

    <form id="sandy-form" action="{% url 'dashboard:sandy_feedback' %}" method="post" class="hidden space-y-3 p-4">
      {% csrf_token %}
      <fieldset>
        <legend class="text-sm font-semibold text-ink-900">How is your experience?</legend>
        <p class="mt-0.5 text-xs text-ink-500">Rate GFR from 1 to 5.</p>
        <div class="mt-3 grid grid-cols-5 gap-2">
          {% for score in "12345" %}
            <label class="cursor-pointer">
              <input type="radio" name="rating" value="{{ score }}" class="peer sr-only"
                     aria-label="Rating {{ score }} out of 5" required>
              <span class="flex h-8 items-center justify-center rounded-xl border border-ink-200 text-sm font-bold text-ink-600 transition hover:-translate-y-0.5 hover:border-brand-400 hover:text-brand-700 peer-checked:border-brand-600 peer-checked:bg-brand-600 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-brand-400 peer-focus-visible:ring-offset-2">
                {{ score }}
              </span>
            </label>
          {% endfor %}
        </div>
      </fieldset>

      <label class="block">
        <span class="text-sm font-semibold text-ink-900">Any bugs?</span>
        <textarea name="bugs" rows="2" maxlength="2000" placeholder="Tell Sandy what went wrong…"
                  class="mt-2 w-full resize-none rounded-xl border border-ink-200 bg-ink-50 px-3 py-2 text-sm focus:border-brand-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20"></textarea>
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-ink-900">What features would you like?</span>
        <textarea name="features" rows="2" maxlength="2000" placeholder="Share an idea for GFR…"
                  class="mt-2 w-full resize-none rounded-xl border border-ink-200 bg-ink-50 px-3 py-2 text-sm focus:border-brand-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20"></textarea>
      </label>

      <p id="sandy-error" class="hidden rounded-lg bg-rose-50 px-3 py-2 text-xs text-rose-700" role="alert"></p>
      <button type="submit" id="sandy-submit"
              class="w-full rounded-xl bg-brand-700 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-brand-800 hover:shadow-md disabled:cursor-wait disabled:opacity-60">
        Send review
      </button>
    </form>

    <div id="sandy-thanks" class="hidden px-6 py-10 text-center" aria-live="polite">
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-emerald-50 text-emerald-600">
        <svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12l4 4L19 6"/>
        </svg>
      </div>
      <h3 id="sandy-thanks-title" tabindex="-1" class="mt-4 font-serif text-xl font-semibold text-ink-900">Thank you!</h3>
      <p class="mt-1 text-sm text-ink-600">Your review helps us make GFR better.</p>
    </div>
  </section>

  <button type="button" id="sandy-bubble"
          class="sandy-float relative flex h-20 w-20 items-center justify-center rounded-full bg-white p-1.5 text-white shadow-2xl shadow-brand-800/40 transition hover:scale-105 focus:outline-none focus:ring-4 focus:ring-brand-200"
          aria-label="Open Sandy" aria-expanded="false" aria-controls="sandy-panel">
    <span class="sandy-ring absolute inset-0 rounded-full border-2 border-brand-400"></span>
    <img src="{% static 'img/sandy-mascot.png' %}" alt=""
         class="relative h-full w-full rounded-full object-cover">
    <span class="absolute -right-0.5 -top-0.5 h-4.5 w-4.5 rounded-full border-2 border-white bg-emerald-400"></span>
  </button>
</aside>

<script>
  (() => {
    const widget = document.getElementById('sandy-widget');
    if (!widget) return;

    const bubble = document.getElementById('sandy-bubble');
    const prompt = document.getElementById('sandy-prompt');
    const panel = document.getElementById('sandy-panel');
    const modePicker = document.getElementById('sandy-mode-picker');
    const tabs = document.getElementById('sandy-tabs');
    const chatPane = document.getElementById('sandy-chat');
    const chatLog = document.getElementById('sandy-chat-log');
    const chatForm = document.getElementById('sandy-chat-form');
    const chatInput = document.getElementById('sandy-chat-input');
    const chatSend = document.getElementById('sandy-chat-send');
    const chatError = document.getElementById('sandy-chat-error');
    const form = document.getElementById('sandy-form');
    const thanks = document.getElementById('sandy-thanks');
    const error = document.getElementById('sandy-error');
    const submit = document.getElementById('sandy-submit');
    const chatUrl = widget.dataset.chatUrl;
    const userName = widget.dataset.userName || 'there';
    const userAvatar = widget.dataset.userAvatar || '';
    const sandyAvatar = widget.dataset.sandyAvatar;
    const csrfToken = form.querySelector('[name=csrfmiddlewaretoken]').value;
    const sandyAvatarHTML = `<img src="${sandyAvatar}" alt="Sandy" class="h-7 w-7 shrink-0 rounded-full border border-brand-100 bg-white object-cover shadow-sm self-end">`;
    const userAvatarHTML = `<img src="${userAvatar}" alt="" class="h-7 w-7 shrink-0 rounded-full border border-ink-100 bg-white object-cover self-end">`;

    let mode = null;
    const history = [];

    const appendBubble = (role, text) => {
      const isUser = role === 'user';
      const row = document.createElement('div');
      row.className = isUser ? 'flex justify-end gap-2' : 'flex justify-start gap-2';
      const bubbleEl = document.createElement('div');
      bubbleEl.className = isUser
        ? 'max-w-[75%] rounded-2xl rounded-br-sm bg-brand-700 px-3 py-2 text-sm text-white'
        : 'max-w-[75%] rounded-2xl rounded-bl-sm bg-ink-50 px-3 py-2 text-sm text-ink-800';
      bubbleEl.textContent = text;
      if (isUser) {
        row.appendChild(bubbleEl);
        row.insertAdjacentHTML('beforeend', userAvatarHTML);
      } else {
        row.insertAdjacentHTML('afterbegin', sandyAvatarHTML);
        row.appendChild(bubbleEl);
      }
      chatLog.appendChild(row);
      chatLog.scrollTop = chatLog.scrollHeight;
    };

    const showThinking = () => {
      const row = document.createElement('div');
      row.id = 'sandy-thinking';
      row.className = 'flex justify-start gap-2';
      row.setAttribute('aria-label', 'Sandy is thinking');
      row.innerHTML = sandyAvatarHTML
        + '<div class="flex items-center gap-1 rounded-2xl rounded-bl-sm bg-ink-50 px-4 py-3">'
        + '<span class="sandy-typing-dot"></span><span class="sandy-typing-dot"></span>'
        + '<span class="sandy-typing-dot"></span></div>';
      chatLog.appendChild(row);
      chatLog.scrollTop = chatLog.scrollHeight;
    };

    const hideThinking = () => {
      const row = document.getElementById('sandy-thinking');
      if (row) row.remove();
    };

    const ensureWelcome = () => {
      if (chatLog.childElementCount) return;
      appendBubble(
        'model',
        `Hi ${userName.split(' ')[0]}! I'm Sandy. Ask me how GFR works for your role — journals, projects, reviews, messaging, anything. You can also switch to Review to share feedback.`
      );
    };

    const setTabStyles = () => {
      tabs.querySelectorAll('[data-sandy-tab]').forEach(tab => {
        const active = tab.dataset.sandyTab === mode;
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
        tab.className = active
          ? 'px-3 py-2.5 text-sm font-semibold text-brand-800 border-b-2 border-brand-700'
          : 'px-3 py-2.5 text-sm font-semibold text-ink-500 border-b-2 border-transparent';
      });
    };

    const showMode = next => {
      mode = next;
      modePicker.classList.add('hidden');
      tabs.classList.remove('hidden');
      thanks.classList.add('hidden');
      setTabStyles();
      if (mode === 'chat') {
        form.classList.add('hidden');
        chatPane.classList.remove('hidden');
        ensureWelcome();
        chatInput.focus();
      } else {
        chatPane.classList.add('hidden');
        form.classList.remove('hidden');
        const rating = form.querySelector('input[name="rating"]');
        if (rating) rating.focus();
      }
    };

    const open = () => {
      panel.classList.remove('hidden');
      prompt.classList.add('hidden');
      bubble.setAttribute('aria-expanded', 'true');
      if (!mode) {
        modePicker.classList.remove('hidden');
        tabs.classList.add('hidden');
        chatPane.classList.add('hidden');
        form.classList.add('hidden');
        thanks.classList.add('hidden');
        modePicker.querySelector('[data-sandy-mode]').focus();
      } else if (!thanks.classList.contains('hidden')) {
        document.getElementById('sandy-thanks-title').focus();
      } else {
        showMode(mode);
      }
    };

    const close = () => {
      panel.classList.add('hidden');
      bubble.setAttribute('aria-expanded', 'false');
      bubble.focus();
    };

    bubble.addEventListener('click', () => panel.classList.contains('hidden') ? open() : close());
    prompt.querySelectorAll('[data-sandy-quick]').forEach(button => {
      button.addEventListener('click', () => {
        if (panel.classList.contains('hidden')) open();
        showMode(button.dataset.sandyQuick);
      });
    });
    document.getElementById('sandy-close').addEventListener('click', close);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !panel.classList.contains('hidden')) close();
    });

    modePicker.querySelectorAll('[data-sandy-mode]').forEach(button => {
      button.addEventListener('click', () => showMode(button.dataset.sandyMode));
    });
    tabs.querySelectorAll('[data-sandy-tab]').forEach(tab => {
      tab.addEventListener('click', () => showMode(tab.dataset.sandyTab));
    });

    chatInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });

    chatForm.addEventListener('submit', async event => {
      event.preventDefault();
      const message = chatInput.value.trim();
      if (!message) return;
      chatError.classList.add('hidden');
      appendBubble('user', message);
      chatInput.value = '';
      chatSend.disabled = true;
      chatSend.textContent = '…';
      showThinking();
      try {
        const response = await fetch(chatUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken,
            'X-Requested-With': 'XMLHttpRequest',
          },
          body: JSON.stringify({ message, history }),
        });
        const isJson = (response.headers.get('Content-Type') || '').includes('application/json');
        const data = isJson ? await response.json() : {};
        if (!response.ok) throw new Error(data.error || 'Sandy could not reply.');
        history.push({ role: 'user', text: message });
        history.push({ role: 'model', text: data.reply });
        if (history.length > 24) history.splice(0, history.length - 24);
        appendBubble('model', data.reply);
      } catch (exception) {
        chatError.textContent = exception.message || 'Sandy could not reply. Please try again.';
        chatError.classList.remove('hidden');
      } finally {
        hideThinking();
        chatSend.disabled = false;
        chatSend.textContent = 'Send';
        chatInput.focus();
      }
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      error.classList.add('hidden');
      submit.disabled = true;
      submit.textContent = 'Sending…';
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: {'X-Requested-With': 'XMLHttpRequest'},
        });
        const isJson = (response.headers.get('Content-Type') || '').includes('application/json');
        const data = isJson ? await response.json() : {};
        if (!response.ok) throw new Error(data.error || 'Could not send your review.');
        form.classList.add('hidden');
        tabs.classList.add('hidden');
        chatPane.classList.add('hidden');
        thanks.classList.remove('hidden');
        prompt.classList.add('hidden');
        document.getElementById('sandy-thanks-title').focus();
      } catch (exception) {
        error.textContent = exception.message || 'Could not send your review. Please try again.';
        error.classList.remove('hidden');
      } finally {
        submit.disabled = false;
        submit.textContent = 'Send review';
      }
    });
  })();
</script>
