{% load static %}
<style>
  @keyframes sandy-float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-7px) rotate(1deg); }
  }
  @keyframes sandy-ring {
    0% { transform: scale(.85); opacity: .6; }
    75%, 100% { transform: scale(1.45); opacity: 0; }
  }
  @keyframes sandy-arrive {
    from { opacity: 0; transform: translateY(12px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .sandy-float { animation: sandy-float 3.2s ease-in-out infinite; }
  .sandy-ring { animation: sandy-ring 2.2s ease-out infinite; }
  .sandy-arrive { animation: sandy-arrive .22s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    .sandy-float, .sandy-ring, .sandy-arrive { animation: none; }
  }
</style>

<aside id="sandy-widget" class="fixed bottom-5 right-5 z-50 flex flex-col items-end gap-3">
  <div id="sandy-prompt"
       class="sandy-arrive max-w-[17rem] rounded-2xl rounded-br-sm border border-brand-100 bg-white px-4 py-3 shadow-xl shadow-brand-900/10">
    <button type="button" id="sandy-prompt-open" class="flex items-center gap-3 text-left"
            aria-expanded="false" aria-controls="sandy-panel">
      <img src="{% static 'img/sandy-mascot.png' %}" alt=""
           class="h-10 w-10 shrink-0 rounded-full border border-brand-100 bg-white object-cover shadow-sm">
      <span>
        <span class="block text-xs font-bold text-brand-700">Sandy</span>
        <span class="mt-0.5 block text-sm leading-snug text-ink-700">
          Please give us your review here.
        </span>
      </span>
    </button>
  </div>

  <section id="sandy-panel"
           class="hidden sandy-arrive w-[min(22rem,calc(100vw-2.5rem))] overflow-hidden rounded-2xl border border-ink-100 bg-white shadow-2xl shadow-brand-900/20"
           aria-labelledby="sandy-title">
    <div class="flex items-center justify-between bg-gradient-to-r from-brand-800 to-brand-600 px-5 py-4 text-white">
      <div class="flex items-center gap-3">
        <img src="{% static 'img/sandy-mascot.png' %}" alt="Sandy"
             class="h-11 w-11 rounded-full border-2 border-white/80 bg-white object-cover shadow-md">
        <div>
          <p class="text-[11px] font-semibold uppercase tracking-[.18em] text-brand-100">Meet Sandy</p>
          <h2 id="sandy-title" class="font-serif text-lg font-semibold">Help us improve GFR</h2>
        </div>
      </div>
      <button type="button" id="sandy-close"
              class="rounded-full p-1.5 text-brand-100 transition hover:bg-white/10 hover:text-white"
              aria-label="Close feedback">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <form id="sandy-form" action="{% url 'dashboard:sandy_feedback' %}" method="post" class="space-y-5 p-5">
      {% csrf_token %}
      <fieldset>
        <legend class="text-sm font-semibold text-ink-900">How is your experience?</legend>
        <p class="mt-0.5 text-xs text-ink-500">Rate GFR from 1 to 5.</p>
        <div class="mt-3 grid grid-cols-5 gap-2">
          {% for score in "12345" %}
            <label class="cursor-pointer">
              <input type="radio" name="rating" value="{{ score }}" class="peer sr-only"
                     aria-label="Rating {{ score }} out of 5" required>
              <span class="flex h-10 items-center justify-center rounded-xl border border-ink-200 text-sm font-bold text-ink-600 transition hover:-translate-y-0.5 hover:border-brand-400 hover:text-brand-700 peer-checked:border-brand-600 peer-checked:bg-brand-600 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-brand-400 peer-focus-visible:ring-offset-2">
                {{ score }}
              </span>
            </label>
          {% endfor %}
        </div>
      </fieldset>

      <label class="block">
        <span class="text-sm font-semibold text-ink-900">Any bugs?</span>
        <textarea name="bugs" rows="2" maxlength="2000" placeholder="Tell Sandy what went wrong…"
                  class="mt-2 w-full resize-none rounded-xl border border-ink-200 bg-ink-50 px-3 py-2.5 text-sm focus:border-brand-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20"></textarea>
      </label>

      <label class="block">
        <span class="text-sm font-semibold text-ink-900">What features would you like?</span>
        <textarea name="features" rows="2" maxlength="2000" placeholder="Share an idea for GFR…"
                  class="mt-2 w-full resize-none rounded-xl border border-ink-200 bg-ink-50 px-3 py-2.5 text-sm focus:border-brand-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20"></textarea>
      </label>

      <p id="sandy-error" class="hidden rounded-lg bg-rose-50 px-3 py-2 text-xs text-rose-700" role="alert"></p>
      <button type="submit" id="sandy-submit"
              class="w-full rounded-xl bg-brand-700 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-brand-800 hover:shadow-md disabled:cursor-wait disabled:opacity-60">
        Send review
      </button>
    </form>

    <div id="sandy-thanks" class="hidden px-6 py-10 text-center" aria-live="polite">
      <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-emerald-50 text-emerald-600">
        <svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12l4 4L19 6"/>
        </svg>
      </div>
      <h3 id="sandy-thanks-title" tabindex="-1" class="mt-4 font-serif text-xl font-semibold text-ink-900">Thank you!</h3>
      <p class="mt-1 text-sm text-ink-600">Your review helps us make GFR better.</p>
    </div>
  </section>

  <button type="button" id="sandy-bubble"
          class="sandy-float relative flex h-16 w-16 items-center justify-center rounded-full bg-white p-1 text-white shadow-xl shadow-brand-800/30 transition hover:scale-105 focus:outline-none focus:ring-4 focus:ring-brand-200"
          aria-label="Open Sandy feedback" aria-expanded="false" aria-controls="sandy-panel">
    <span class="sandy-ring absolute inset-0 rounded-full border-2 border-brand-400"></span>
    <img src="{% static 'img/sandy-mascot.png' %}" alt=""
         class="relative h-full w-full rounded-full object-cover">
    <span class="absolute -right-0.5 -top-0.5 h-4 w-4 rounded-full border-2 border-white bg-emerald-400"></span>
  </button>
</aside>

<script>
  (() => {
    const widget = document.getElementById('sandy-widget');
    if (!widget) return;
    const bubble = document.getElementById('sandy-bubble');
    const prompt = document.getElementById('sandy-prompt');
    const promptOpen = document.getElementById('sandy-prompt-open');
    const panel = document.getElementById('sandy-panel');
    const form = document.getElementById('sandy-form');
    const thanks = document.getElementById('sandy-thanks');
    const error = document.getElementById('sandy-error');
    const submit = document.getElementById('sandy-submit');

    const open = () => {
      panel.classList.remove('hidden');
      prompt.classList.add('hidden');
      bubble.setAttribute('aria-expanded', 'true');
      promptOpen.setAttribute('aria-expanded', 'true');
      if (thanks.classList.contains('hidden')) {
        panel.querySelector('input[name="rating"]').focus();
      } else {
        document.getElementById('sandy-thanks-title').focus();
      }
    };
    const close = () => {
      panel.classList.add('hidden');
      bubble.setAttribute('aria-expanded', 'false');
      promptOpen.setAttribute('aria-expanded', 'false');
      bubble.focus();
    };

    bubble.addEventListener('click', () => panel.classList.contains('hidden') ? open() : close());
    promptOpen.addEventListener('click', open);
    document.getElementById('sandy-close').addEventListener('click', close);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !panel.classList.contains('hidden')) close();
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      error.classList.add('hidden');
      submit.disabled = true;
      submit.textContent = 'Sending…';
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: {'X-Requested-With': 'XMLHttpRequest'},
        });
        const isJson = (response.headers.get('Content-Type') || '').includes('application/json');
        const data = isJson ? await response.json() : {};
        if (!response.ok) throw new Error(data.error || 'Could not send your review.');
        form.classList.add('hidden');
        thanks.classList.remove('hidden');
        prompt.classList.add('hidden');
        document.getElementById('sandy-thanks-title').focus();
      } catch (exception) {
        error.textContent = exception.message || 'Could not send your review. Please try again.';
        error.classList.remove('hidden');
      } finally {
        submit.disabled = false;
        submit.textContent = 'Send review';
      }
    });
  })();
</script>
