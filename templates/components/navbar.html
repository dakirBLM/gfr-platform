{% url 'core:home' as home_url %}
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-ink-100">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <a href="{{ home_url }}" class="flex items-center gap-2 group">
      <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-brand-800 text-white font-serif text-lg font-bold">G</span>
      <span class="font-serif text-lg font-semibold tracking-tight text-ink-900">GFR<span class="hidden sm:inline text-ink-600 font-sans font-normal text-sm ml-2">Global Forum for Researchers</span></span>
    </a>

    <div class="hidden md:flex items-center gap-1 text-sm font-medium text-ink-700">
      <a href="{% url 'core:home' %}" class="px-3 py-2 rounded-md hover:bg-ink-100">Home</a>
      <a href="#" class="px-3 py-2 rounded-md hover:bg-ink-100">Researchers</a>
      <a href="#" class="px-3 py-2 rounded-md hover:bg-ink-100">Journals</a>
      <a href="#" class="px-3 py-2 rounded-md hover:bg-ink-100">Projects</a>
      <a href="#" class="px-3 py-2 rounded-md hover:bg-ink-100">Conferences</a>
      <a href="{% url 'core:about' %}" class="px-3 py-2 rounded-md hover:bg-ink-100">About</a>
    </div>

    <div class="flex items-center gap-2">
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard:home' %}" class="text-sm px-3 py-1.5 rounded-md bg-brand-700 text-white hover:bg-brand-800 inline-flex items-center gap-1.5">
          Open dashboard
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </a>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="text-sm px-3 py-1.5 rounded-md text-ink-700 hover:bg-ink-100">Sign in</a>
        <a href="{% url 'accounts:register' %}" class="text-sm px-3 py-1.5 rounded-md bg-brand-700 text-white hover:bg-brand-800">Join GFR</a>
      {% endif %}
    </div>
  </nav>
</header>
